---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # read workflow run metadata for the actions language pack
      contents: read # check out the repository source
      packages: read # pull CodeQL bundles and dependencies
      security-events: write # upload analysis results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ["actions"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@94a4f68a6b95ecc1677fbcac1683119fd869adf7 # v2026.07.04
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
